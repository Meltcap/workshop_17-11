<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Two-Player Turn-Based Snake Game">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/game.css">
</head>
<body>
    <div id="game-container">
        <div id="player-input-container">
            <h1>Snake Game</h1>
            <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="50">
            <button id="start-button">Start Game</button>
        </div>
        
        <div id="score-display">Score: <span id="score-value">0</span></div>
        
        <canvas id="game-canvas" width="600" height="400"></canvas>
        
        <div id="high-score-container">
            <h2>High Scores</h2>
            <ul id="high-score-list"></ul>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p id="game-over-message"></p>
            <p id="game-over-score"></p>
            <button id="game-over-ok" class="modal-button">OK</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
